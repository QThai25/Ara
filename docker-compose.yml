services:
  backend:
    container_name: ara-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Backend/.env.production
    environment:
      # Production-safe default. Use docker-compose.env.example explicitly for local development.
      NODE_ENV: ${DOCKER_NODE_ENV:-production}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      FRONTEND_URL: ${DOCKER_FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${DOCKER_BACKEND_URL:-http://localhost:4000}
      PAYOS_ENABLED: ${DOCKER_PAYOS_ENABLED:-false}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - ara-network
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    container_name: ara-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:5174}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://aradress.com}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - ara-network

  adminfrontend:
    container_name: ara-adminfrontend
    build:
      context: ./AdminFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
        VITE_CUSTOMER_URL: ${VITE_CUSTOMER_URL:-http://localhost:5173}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - ara-network

networks:
  ara-network:
    name: ara-network
    driver: bridge
